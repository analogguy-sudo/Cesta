<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<script>
  // Design vor dem ersten Zeichnen setzen, damit nichts aufblitzt.
  try { const t = localStorage.getItem('cesta.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cesta">
<title>Cesta</title>
<link rel="stylesheet" href="style.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script src="config.js"></script>
<script src="defaults.js"></script>
</head>
<body>
<div id="app">
  <section id="auth" class="auth" hidden>
    <div class="auth-card">
      <img src="assets/icon.svg" alt="" class="auth-logo">
      <h1>Cesta</h1>
      <p class="muted" data-i18n="tagline"></p>
      <form id="login-form">
        <label><span data-i18n="email"></span><input type="email" name="email" autocomplete="username" required></label>
        <label><span data-i18n="password"></span><input type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn primary" type="submit" data-i18n="login"></button>
        <button class="btn link" type="button" data-action="forgot" data-i18n="forgot"></button>
      </form>
      <form id="password-form" hidden>
        <p data-i18n="setPasswordHint"></p>
        <label><span data-i18n="newPassword"></span><input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
        <button class="btn primary" type="submit" data-i18n="savePassword"></button>
      </form>
      <div class="lang-switch" role="group">
        <button type="button" data-action="lang" data-lang="de">Deutsch</button>
        <button type="button" data-action="lang" data-lang="es">Español</button>
      </div>
    </div>
  </section>

  <section id="main" hidden>
    <header class="topbar">
      <img src="assets/icon.svg" alt="" class="top-logo">
      <h1 id="view-title"></h1>
      <span id="sync" class="sync" aria-live="polite"></span>
    </header>
    <div class="search-wrap" id="search-wrap">
      <input id="search" type="search" autocomplete="off" enterkeyhint="done">
      <div id="suggestions" class="suggestions" hidden></div>
    </div>
    <main id="view"></main>
    <nav class="tabbar">
      <button data-tab="list"><span class="tab-icon">🧺</span><span data-i18n="tabList"></span><b id="list-count" class="badge" hidden></b></button>
      <button data-tab="stock"><span class="tab-icon">🏠</span><span data-i18n="tabStock"></span><b id="low-count" class="badge warn" hidden></b></button>
      <button data-tab="catalog"><span class="tab-icon">📦</span><span data-i18n="tabCatalog"></span></button>
      <button data-tab="settings"><span class="tab-icon">⚙️</span><span data-i18n="tabSettings"></span></button>
    </nav>
  </section>

  <section id="shop" class="shop" hidden>
    <header class="shop-bar">
      <button type="button" class="shop-close" data-action="shop-close" aria-label="×">✕</button>
      <div class="shop-title"><b data-i18n="shopping"></b><span id="shop-progress"></span></div>
    </header>
    <div class="shop-progressbar"><i id="shop-bar"></i></div>
    <main id="shop-view"></main>
    <footer class="shop-foot"><button type="button" class="btn primary" data-action="finish" id="shop-finish"></button></footer>
  </section>
</div>

<dialog id="sheet"><form method="dialog" id="sheet-form"></form></dialog>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js?v=2"></script>
</body>
</html>
